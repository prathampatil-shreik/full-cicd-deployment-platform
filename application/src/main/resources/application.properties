# ============================================================
# TaskFlow - Task Management System
# ============================================================
# DB credentials are supplied via environment variables.
# Local defaults point to a local PostgreSQL instance.
# ============================================================

server.port=${PORT:8080}

# Application identity
app.env=${APP_ENV:LOCAL}
app.version=${APP_VERSION:local-dev}
app.message=${APP_MESSAGE:Welcome to TaskFlow}

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.example.taskflow=INFO
logging.level.org.hibernate.SQL=WARN

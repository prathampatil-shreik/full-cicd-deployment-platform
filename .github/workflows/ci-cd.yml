name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ECR image tag to deploy or rollback"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1

  # ECR repository name — matches the name created by the ECR Terraform module.
  # Format: <project_name>-<environment>-app
  ECR_REPOSITORY: full-cicd-deployment-platform-dev-app

  # ECS names — must match the names produced by the ECS Terraform module.
  ECS_CLUSTER: full-cicd-deployment-platform-dev
  ECS_SERVICE: full-cicd-deployment-platform-dev-app
  ECS_TASK_DEFINITION: full-cicd-deployment-platform-dev-app

  ECS_CONTAINER_NAME: app
  ECS_CONTAINER_PORT: 8080

  TF_DIR: infrastructure/terraform

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1 - TERRAFORM VALIDATE
  # Runs on every push and PR. Does NOT apply.
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS credentials are valid."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan (validation only — no apply)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
        run: |
          # Validates syntax and provider compatibility using the same var-file
          # as the real apply. db_password and db_secret_arn are injected via
          # TF_VAR_* because they are secrets and must not be in any file.
          terraform plan -input=false \
            -var-file="environments/dev/dev.tfvars"


  # ============================================================
  # JOB 2 - PROVISION / UPDATE DEV INFRASTRUCTURE
  # Runs terraform apply for the dev environment.
  # Creates ECR, VPC, ALB, RDS, ECS cluster/service, IAM role.
  # Must complete before the image is pushed so ECR exists.
  # ============================================================
  infra-dev:
    name: Provision Dev Infrastructure
    runs-on: ubuntu-latest

    needs: validate

    # Only apply on pushes to main/master, not on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment: dev

    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      alb_dns_name: ${{ steps.tf-outputs.outputs.alb_dns_name }}
      ecs_target_group_name: ${{ steps.tf-outputs.outputs.ecs_target_group_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Select or create dev workspace
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform workspace select dev 2>/dev/null || terraform workspace new dev

      - name: Terraform apply — dev
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file="environments/dev/dev.tfvars"

      - name: Read Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          TG_NAME=$(terraform output -raw ecs_target_group_name)

          echo "ecr_repository_url=${ECR_URL}" >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=${ALB_DNS}"        >> "$GITHUB_OUTPUT"
          echo "ecs_target_group_name=${TG_NAME}" >> "$GITHUB_OUTPUT"

          echo "ECR URL   : ${ECR_URL}"
          echo "ALB DNS   : ${ALB_DNS}"
          echo "TG Name   : ${TG_NAME}"


  # ============================================================
  # JOB 3 - BUILD AND PUSH DOCKER IMAGE
  # Runs after infra-dev so ECR is guaranteed to exist.
  # Manual workflow_dispatch uses an existing image tag — skips build.
  # ============================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    needs:
      - validate
      - infra-dev

    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"

          echo "IMAGE_LATEST=${REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${REGISTRY}/${ECR_REPOSITORY}:${SHA}"    >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: application
          file: application/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageTags' \
            --output text


  # ============================================================
  # JOB 4 - DEPLOY TO ECS FARGATE (DEV)
  # ============================================================
  deploy-dev:
    name: Deploy to ECS Fargate (Dev)
    runs-on: ubuntu-latest

    needs:
      - infra-dev
      - build

    if: |
      always() &&
      needs.infra-dev.result == 'success' &&
      (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        github.event_name == 'workflow_dispatch'
      )

    environment: dev

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Determine which image should be deployed
      # ----------------------------------------------------------
      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}"   >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}"   >> "$GITHUB_ENV"

          echo "Deploying image: ${IMAGE_URI}"

      # ----------------------------------------------------------
      # Verify requested image exists in ECR
      # ----------------------------------------------------------
      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

      # ----------------------------------------------------------
      # Download current ECS task definition
      # ----------------------------------------------------------
      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --region "${AWS_REGION}" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      # ----------------------------------------------------------
      # Remove AWS-generated fields and replace only the image
      # ----------------------------------------------------------
      - name: Prepare new task definition
        run: |
          jq \
            --arg IMAGE "${IMAGE_URI}" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |=
              map(
                if .name == env.ECS_CONTAINER_NAME
                then .image = $IMAGE
                else .
                end
              )
            ' task-definition.json > new-task-definition.json

          echo "New ECS task definition prepared."

      # ----------------------------------------------------------
      # Register new ECS task definition revision
      # ----------------------------------------------------------
      - name: Register new ECS task definition
        id: register
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=${TASK_DEFINITION_ARN}" >> "$GITHUB_ENV"

          echo "Registered: ${TASK_DEFINITION_ARN}"

      # ----------------------------------------------------------
      # Update ECS service with new task definition
      # ----------------------------------------------------------
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --region "${AWS_REGION}" \
            --output json | jq '{
              service:   .service.serviceName,
              taskDef:   .service.taskDefinition,
              desired:   .service.desiredCount,
              running:   .service.runningCount,
              pending:   .service.pendingCount
            }'

      # ----------------------------------------------------------
      # Wait for ECS rolling deployment to complete.
      # Custom loop replaces `aws ecs wait services-stable` which
      # has a hard 600 s ceiling — too short for a rolling deploy
      # with minimumHealthyPercent=100 and ALB drain time.
      # ----------------------------------------------------------
      - name: Wait for ECS deployment to complete
        run: |
          echo "========================================"
          echo "Waiting for ECS deployment to complete"
          echo "Cluster : ${ECS_CLUSTER}"
          echo "Service : ${ECS_SERVICE}"
          echo "Task def: ${TASK_DEFINITION_ARN}"
          echo "Timeout : 20 minutes"
          echo "========================================"

          MAX_ITERATIONS=80   # 80 × 15 s = 1200 s = 20 minutes
          SLEEP_SECONDS=15
          LAST_EVENT_TIME=""

          for i in $(seq 1 ${MAX_ITERATIONS}); do

            SERVICE_JSON=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --output json)

            DESIRED=$(echo "${SERVICE_JSON}" | jq -r '.services[0].desiredCount')
            RUNNING=$(echo "${SERVICE_JSON}" | jq -r '.services[0].runningCount')
            PENDING=$(echo "${SERVICE_JSON}" | jq -r '.services[0].pendingCount')

            PRIMARY_JSON=$(echo "${SERVICE_JSON}" | \
              jq -r '.services[0].deployments[] | select(.status=="PRIMARY")')

            ROLLOUT_STATE=$(echo "${PRIMARY_JSON}" | jq -r '.rolloutState')
            PRIMARY_RUNNING=$(echo "${PRIMARY_JSON}" | jq -r '.runningCount')
            PRIMARY_DESIRED=$(echo "${PRIMARY_JSON}" | jq -r '.desiredCount')

            TS=$(date -u +"%H:%M:%S")
            echo "[${i}/${MAX_ITERATIONS}] ${TS} | desired=${DESIRED} running=${RUNNING} pending=${PENDING} | primary: running=${PRIMARY_RUNNING}/${PRIMARY_DESIRED} rollout=${ROLLOUT_STATE}"

            NEW_EVENTS=$(echo "${SERVICE_JSON}" | \
              jq -r --arg LAST "${LAST_EVENT_TIME}" \
              '.services[0].events[]
               | select(.createdAt > $LAST)
               | "  EVENT: " + .message' 2>/dev/null | tail -5)

            if [ -n "${NEW_EVENTS}" ]; then
              echo "${NEW_EVENTS}"
              LAST_EVENT_TIME=$(echo "${SERVICE_JSON}" | \
                jq -r '.services[0].events[0].createdAt // ""')
            fi

            if [ "${ROLLOUT_STATE}" = "FAILED" ]; then
              echo ""
              echo "ERROR: ECS deployment FAILED (rolloutState=FAILED)."
              echo "Recent service events:"
              echo "${SERVICE_JSON}" | \
                jq -r '.services[0].events[:10][] | "  " + .message'
              exit 1
            fi

            if [ "${ROLLOUT_STATE}" = "COMPLETED" ] \
              && [ "${RUNNING}" = "${DESIRED}" ] \
              && [ "${PENDING}" = "0" ]; then
              echo ""
              echo "========================================"
              echo "ECS deployment completed successfully."
              echo "desired=${DESIRED} running=${RUNNING} pending=${PENDING}"
              echo "========================================"
              exit 0
            fi

            sleep ${SLEEP_SECONDS}

          done

          echo ""
          echo "ERROR: Timed out after $((MAX_ITERATIONS * SLEEP_SECONDS)) seconds."
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments}' \
            --output json
          exit 1

      # ----------------------------------------------------------
      # Show final ECS service status
      # ----------------------------------------------------------
      - name: Show ECS deployment status
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[0].{
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition
            }' \
            --output table


  # ============================================================
  # JOB 5 - VERIFY ECS + ALB (DEV)
  # ============================================================
  verify-dev:
    name: Verify ECS Deployment (Dev)
    runs-on: ubuntu-latest

    needs:
      - infra-dev
      - deploy-dev

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Verify ECS running tasks
      # ----------------------------------------------------------
      - name: Check ECS running tasks
        run: |
          echo "Checking ECS running tasks..."

          RUNNING=0
          DESIRED=0

          for i in $(seq 1 12); do

            SVC=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].{running:runningCount,desired:desiredCount}' \
              --output json)

            RUNNING=$(echo "${SVC}" | jq -r '.running')
            DESIRED=$(echo "${SVC}" | jq -r '.desired')

            echo "[${i}/12] Running=${RUNNING}, Desired=${DESIRED}"

            if [ "${RUNNING}" -eq "${DESIRED}" ] && [ "${RUNNING}" -ge 2 ]; then
              echo "ECS task count is healthy."
              break
            fi

            sleep 15

          done

          if [ "${RUNNING}" -lt 2 ]; then
            echo "ERROR: ECS does not have 2 running tasks."
            exit 1
          fi

      # ----------------------------------------------------------
      # Find ECS target group — derived from infra-dev output
      # ----------------------------------------------------------
      - name: Get ECS target group ARN
        id: target-group
        run: |
          ECS_TG_NAME="${{ needs.infra-dev.outputs.ecs_target_group_name }}"

          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${ECS_TG_NAME}" \
            --region "${AWS_REGION}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          echo "TG_ARN=${TG_ARN}" >> "$GITHUB_ENV"

          echo "Target group: ${TG_ARN}"

      # ----------------------------------------------------------
      # Verify healthy Fargate targets
      # ----------------------------------------------------------
      - name: Check ECS target health
        run: |
          HEALTHY=0

          for i in $(seq 1 12); do

            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "${TG_ARN}" \
              --region "${AWS_REGION}" \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)

            echo "[${i}/12] Healthy targets: ${HEALTHY}"

            if [ "${HEALTHY}" -ge 2 ]; then
              echo "Both ECS targets are healthy."
              break
            fi

            sleep 15

          done

          if [ "${HEALTHY}" -lt 2 ]; then
            echo "ERROR: Less than 2 healthy ECS targets."
            exit 1
          fi

      # ----------------------------------------------------------
      # Final ALB health check — ALB DNS derived from Terraform output
      # ----------------------------------------------------------
      - name: Verify application through ALB
        run: |
          ALB_DNS="${{ needs.infra-dev.outputs.alb_dns_name }}"
          URL="http://${ALB_DNS}/health"

          echo "Testing: ${URL}"

          for i in $(seq 1 10); do

            HTTP_CODE=$(curl \
              -s \
              -o /tmp/health-response.json \
              -w "%{http_code}" \
              --max-time 10 \
              "${URL}" || true)

            echo "[${i}/10] HTTP ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then

              echo "Application health check passed."

              echo "Response:"
              cat /tmp/health-response.json

              exit 0
            fi

            sleep 15

          done

          echo "ERROR: Application health check failed."
          exit 1

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: 925213028316.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: full-cicd-deployment-platform-dev-app
  ASG_NAME: full-cicd-deployment-platform-dev-app-asg
  ALB_DNS: full-cicd-deployment-dev-alb-1109505190.us-east-1.elb.amazonaws.com
  TF_DIR: infrastructure/terraform

# No id-token permission needed — authentication uses IAM access keys via secrets.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 – validate (runs on every push and PR)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan (no apply)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -input=false \
            -out=tfplan

  # ─────────────────────────────────────────────────────────────
  # JOB 2 – build & push (only on push to main/master)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_LATEST=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: application
          file: application/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageTags' \
            --output text

  # ─────────────────────────────────────────────────────────────
  # JOB 3 – deploy (rolling instance refresh)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ASG
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get current Launch Template ID
        id: lt
        run: |
          LT_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' \
            --output text)
          echo "lt_id=${LT_ID}" >> "$GITHUB_OUTPUT"

      - name: Create new Launch Template version with updated image tag
        id: lt_version
        run: |
          USERDATA=$(aws ec2 describe-launch-template-versions \
            --launch-template-id "${{ steps.lt.outputs.lt_id }}" \
            --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData.UserData' \
            --output text)

          # Decode, replace the image tag, re-encode
          DECODED=$(echo "$USERDATA" | base64 -d)
          UPDATED=$(echo "$DECODED" | sed \
            "s|${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:[^ ]*|${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}|g")
          ENCODED=$(echo "$UPDATED" | base64 -w 0)

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "${{ steps.lt.outputs.lt_id }}" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${ENCODED}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Launch Template default version
        run: |
          aws ec2 modify-launch-template \
            --launch-template-id "${{ steps.lt.outputs.lt_id }}" \
            --default-version "${{ steps.lt_version.outputs.new_version }}"

      - name: Start instance refresh (rolling deploy)
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 300,
              "CheckpointPercentages": [50, 100],
              "CheckpointDelay": 60
            }' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=${REFRESH_ID}" >> "$GITHUB_OUTPUT"
          echo "Instance refresh started: ${REFRESH_ID}"

      - name: Wait for instance refresh to complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          echo "Polling refresh ${REFRESH_ID}..."
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ env.ASG_NAME }}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "  [${i}/40] Status: ${STATUS}"
            case "${STATUS}" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed)
                echo "Instance refresh failed with status: ${STATUS}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for instance refresh."
          exit 1

  # ─────────────────────────────────────────────────────────────
  # JOB 4 – verify
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check ASG instance count
        run: |
          INSERVICE=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`] | length(@)' \
            --output text)
          echo "InService instances: ${INSERVICE}"
          [ "${INSERVICE}" -ge 2 ] || { echo "Expected >=2 InService instances"; exit 1; }

      - name: Check ALB target group health
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "full-cicd-deployment-dev-tg" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          for i in $(seq 1 10); do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "${TG_ARN}" \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)
            echo "  [${i}/10] Healthy targets: ${HEALTHY}"
            [ "${HEALTHY}" -ge 1 ] && break
            sleep 30
          done
          [ "${HEALTHY}" -ge 1 ] || { echo "No healthy targets in ALB target group"; exit 1; }

      - name: HTTP health check against ALB
        run: |
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "http://${{ env.ALB_DNS }}/")
            echo "  [${i}/5] HTTP response: ${HTTP_CODE}"
            if [[ "${HTTP_CODE}" =~ ^[23] ]]; then
              echo "ALB health check passed (HTTP ${HTTP_CODE})."
              exit 0
            fi
            sleep 15
          done
          echo "ALB health check failed after retries."
          exit 1

      - name: Verify ECR image exists
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ needs.build.outputs.image_tag }}" \
            --query 'imageDetails[0].imageTags' \
            --output text

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing dev ECR image tag to deploy (dev) or promote (prod)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: cicd-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "284043563957"

  DEV_ECR_REPOSITORY: full-cicd-deployment-platform-dev-app
  DEV_ECS_CLUSTER: full-cicd-deployment-platform-dev
  DEV_ECS_SERVICE: full-cicd-deployment-platform-dev-app
  DEV_ECS_TASK_DEFINITION: full-cicd-deployment-platform-dev-app

  PROD_ECR_REPOSITORY: full-cicd-deployment-platform-prod-app
  PROD_ECS_CLUSTER: full-cicd-deployment-platform-prod
  PROD_ECS_SERVICE: full-cicd-deployment-platform-prod-app
  PROD_ECS_TASK_DEFINITION: full-cicd-deployment-platform-prod-app

  ECS_CONTAINER_NAME: app
  TF_DIR: infrastructure/terraform

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1 — VALIDATE
  # Runs on every push, PR, and manual dispatch.
  # Never applies Terraform.
  # For prod dispatch: validates without selecting dev workspace.
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan — dev (validation only, no apply)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'dev'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
        run: |
          terraform workspace select dev 2>/dev/null || terraform workspace new dev
          terraform plan \
            -input=false \
            -var-file="environments/dev/dev.tfvars"

  # ============================================================
  # JOB 2 — PROVISION / UPDATE DEV INFRASTRUCTURE
  # Runs only on push to main/master or manual dev dispatch.
  # Never runs for PRs or prod dispatch.
  # ============================================================
  infra-dev:
    name: Provision Dev Infrastructure
    runs-on: ubuntu-latest
    needs: validate

    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'dev')

    environment: dev

    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      alb_dns_name: ${{ steps.tf-outputs.outputs.alb_dns_name }}
      ecs_target_group_name: ${{ steps.tf-outputs.outputs.ecs_target_group_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Select dev workspace
        working-directory: ${{ env.TF_DIR }}
        run: terraform workspace select dev 2>/dev/null || terraform workspace new dev

      - name: Terraform apply — dev
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file="environments/dev/dev.tfvars"

      - name: Read Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          TG_NAME=$(terraform output -raw ecs_target_group_name)

          echo "ecr_repository_url=${ECR_URL}"     >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=${ALB_DNS}"            >> "$GITHUB_OUTPUT"
          echo "ecs_target_group_name=${TG_NAME}"   >> "$GITHUB_OUTPUT"

          echo "ECR URL : ${ECR_URL}"
          echo "ALB DNS : ${ALB_DNS}"
          echo "TG Name : ${TG_NAME}"

  # ============================================================
  # JOB 3 — BUILD AND PUSH IMAGE TO DEV ECR
  # Runs only on push (not manual dispatch, not PRs).
  # ============================================================
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [validate, infra-dev]

    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_LATEST=${REGISTRY}/${DEV_ECR_REPOSITORY}:latest" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${REGISTRY}/${DEV_ECR_REPOSITORY}:${SHA}"    >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: application
          file: application/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in dev ECR
        run: |
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$DEV_ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageTags' \
            --output text

  # ============================================================
  # JOB 4 — DEPLOY TO DEV ECS
  # Runs after a push build, or on manual dev dispatch.
  # ============================================================
  deploy-dev:
    name: Deploy to ECS Dev
    runs-on: ubuntu-latest
    needs: [infra-dev, build]

    if: |
      always() &&
      needs.infra-dev.result == 'success' &&
      (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.environment == 'dev')
      )

    environment: dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve and verify image
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi

          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$DEV_ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          echo "IMAGE_TAG=${IMAGE_TAG}"                              >> "$GITHUB_ENV"
          echo "IMAGE_URI=${REGISTRY}/${DEV_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Get current dev task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$DEV_ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Prepare dev task definition
        run: |
          jq --arg IMAGE "$IMAGE_URI" --arg CONTAINER "$ECS_CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == $CONTAINER then .image = $IMAGE else . end
              )
          ' task-definition.json > new-task-definition.json

      - name: Register dev task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://new-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "TASK_DEFINITION_ARN=${TASK_DEFINITION_ARN}" >> "$GITHUB_ENV"
          echo "Registered: ${TASK_DEFINITION_ARN}"

      - name: Update dev ECS service
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$DEV_ECS_CLUSTER" \
            --service "$DEV_ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --output json | jq '{service:.service.serviceName,taskDef:.service.taskDefinition,desired:.service.desiredCount}'

      - name: Wait for dev deployment to complete
        run: |
          echo "Waiting for ECS deployment — timeout 30 min"
          MAX=120
          SLEEP=15

          for i in $(seq 1 $MAX); do
            SVC=$(aws ecs describe-services \
              --region "$AWS_REGION" \
              --cluster "$DEV_ECS_CLUSTER" \
              --services "$DEV_ECS_SERVICE" \
              --output json)

            DESIRED=$(echo "$SVC" | jq -r '.services[0].desiredCount')
            RUNNING=$(echo "$SVC" | jq -r '.services[0].runningCount')
            PENDING=$(echo "$SVC" | jq -r '.services[0].pendingCount')
            ROLLOUT=$(echo "$SVC" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState')

            echo "[${i}/${MAX}] desired=${DESIRED} running=${RUNNING} pending=${PENDING} rollout=${ROLLOUT}"

            if [ "$ROLLOUT" = "FAILED" ]; then
              echo "ERROR: ECS deployment FAILED."
              echo "$SVC" | jq -r '.services[0].events[:5][] | "  " + .message'
              exit 1
            fi

            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ]; then
              echo "Dev deployment completed successfully."
              exit 0
            fi

            sleep $SLEEP
          done

          echo "ERROR: Timed out after $((MAX * SLEEP)) seconds."
          exit 1

      - name: Show dev ECS status
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$DEV_ECS_CLUSTER" \
            --services "$DEV_ECS_SERVICE" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table

  # ============================================================
  # JOB 5 — VERIFY DEV DEPLOYMENT
  # ============================================================
  verify-dev:
    name: Verify Dev Deployment
    runs-on: ubuntu-latest
    needs: [infra-dev, deploy-dev]

    if: |
      always() &&
      needs.infra-dev.result == 'success' &&
      needs.deploy-dev.result == 'success'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify dev ECS task count
        run: |
          RUNNING=0
          DESIRED=0

          for i in $(seq 1 12); do
            SVC=$(aws ecs describe-services \
              --region "$AWS_REGION" \
              --cluster "$DEV_ECS_CLUSTER" \
              --services "$DEV_ECS_SERVICE" \
              --query 'services[0].{running:runningCount,desired:desiredCount}' \
              --output json)

            RUNNING=$(echo "$SVC" | jq -r '.running')
            DESIRED=$(echo "$SVC" | jq -r '.desired')

            echo "[${i}/12] running=${RUNNING} desired=${DESIRED}"

            if [ "$RUNNING" -eq "$DESIRED" ] && [ "$RUNNING" -ge 2 ]; then
              echo "ECS task count healthy."
              break
            fi
            sleep 15
          done

          if [ "$RUNNING" -lt 2 ]; then
            echo "ERROR: fewer than 2 running tasks."
            exit 1
          fi

      - name: Verify dev target group health
        run: |
          TG_NAME="${{ needs.infra-dev.outputs.ecs_target_group_name }}"

          TG_ARN=$(aws elbv2 describe-target-groups \
            --region "$AWS_REGION" \
            --names "$TG_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          HEALTHY=0
          for i in $(seq 1 12); do
            HEALTHY=$(aws elbv2 describe-target-health \
              --region "$AWS_REGION" \
              --target-group-arn "$TG_ARN" \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)

            echo "[${i}/12] healthy targets: ${HEALTHY}"
            if [ "$HEALTHY" -ge 2 ]; then
              echo "Target group healthy."
              break
            fi
            sleep 15
          done

          if [ "$HEALTHY" -lt 2 ]; then
            echo "ERROR: fewer than 2 healthy targets."
            exit 1
          fi

      - name: Verify dev application health endpoint
        run: |
          ALB_DNS="${{ needs.infra-dev.outputs.alb_dns_name }}"
          URL="http://${ALB_DNS}/health"
          echo "Testing: ${URL}"

          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "[${i}/10] HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done

          echo "ERROR: dev health check failed."
          exit 1

  # ============================================================
  # JOB 6 — PROMOTE IMAGE TO PRODUCTION
  # Runs only on manual dispatch selecting environment=prod.
  # Uses GitHub Environment "prod" — configure required reviewers
  # in Settings → Environments → prod → Required reviewers.
  # ============================================================
  promote-prod:
    name: Promote Image to Production
    runs-on: ubuntu-latest
    needs: validate

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'

    environment: prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # 1. Validate the requested tag and confirm it exists in dev ECR
      # ----------------------------------------------------------
      - name: Validate image tag and confirm in dev ECR
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: image_tag input is required."
            exit 1
          fi

          echo "Confirming image tag '${IMAGE_TAG}' exists in dev ECR..."
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$DEV_ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 2. Install Skopeo and authenticate to ECR
      # Skopeo copies the manifest directly between registries —
      # no image pull to the runner, digest is preserved exactly.
      # ----------------------------------------------------------
      - name: Install Skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Authenticate Skopeo to ECR
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | \
            skopeo login \
              --username AWS \
              --password-stdin \
              "$REGISTRY"

      # ----------------------------------------------------------
      # 3. Copy image from dev ECR to prod ECR preserving digest
      # ----------------------------------------------------------
      - name: Copy image to production ECR
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SRC="docker://${REGISTRY}/${DEV_ECR_REPOSITORY}:${IMAGE_TAG}"
          DEST="docker://${REGISTRY}/${PROD_ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Copying: ${SRC} → ${DEST}"
          skopeo copy --preserve-digests "$SRC" "$DEST"

          echo "PROD_IMAGE=${REGISTRY}/${PROD_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 4. Verify image in prod ECR and assert digest matches source
      #
      # aws ecr describe-images returns whichever manifest ECR
      # indexes for the tag — for a buildx OCI image index this
      # can be the manifest-list on the source side but the child
      # platform manifest on the destination side, producing a
      # false mismatch even though the image content is identical.
      #
      # skopeo inspect --raw fetches the raw manifest bytes from
      # the registry and hashes them, so both sides are compared
      # using the same manifest object (the top-level index).
      # ----------------------------------------------------------
      - name: Verify image in prod ECR and compare digest
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SRC_RAW_DIGEST=$(skopeo inspect --raw \
            "docker://${REGISTRY}/${DEV_ECR_REPOSITORY}:${IMAGE_TAG}" \
            | sha256sum | awk '{print "sha256:" $1}')

          DEST_RAW_DIGEST=$(skopeo inspect --raw \
            "docker://${REGISTRY}/${PROD_ECR_REPOSITORY}:${IMAGE_TAG}" \
            | sha256sum | awk '{print "sha256:" $1}')

          echo "Source manifest digest : ${SRC_RAW_DIGEST}"
          echo "Dest manifest digest   : ${DEST_RAW_DIGEST}"

          if [ "$SRC_RAW_DIGEST" != "$DEST_RAW_DIGEST" ]; then
            echo "ERROR: digest mismatch — prod manifest does not match dev source."
            exit 1
          fi

          echo "Digest verified: prod image manifest matches dev source."

      # ----------------------------------------------------------
      # 4. Retrieve existing prod task definition
      # ----------------------------------------------------------
      - name: Get current production task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$PROD_ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > prod-task-definition.json

      # ----------------------------------------------------------
      # 5. Swap only the container image; preserve all other config
      # ----------------------------------------------------------
      - name: Prepare production task definition
        run: |
          jq --arg IMAGE "$PROD_IMAGE" --arg CONTAINER "$ECS_CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == $CONTAINER then .image = $IMAGE else . end
              )
          ' prod-task-definition.json > new-prod-task-definition.json

      # ----------------------------------------------------------
      # 6. Register new prod task definition revision
      # ----------------------------------------------------------
      - name: Register production task definition
        run: |
          PROD_TASK_ARN=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://new-prod-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "Registered: ${PROD_TASK_ARN}"
          echo "PROD_TASK_ARN=${PROD_TASK_ARN}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 7. Update prod ECS service
      # ----------------------------------------------------------
      - name: Update production ECS service
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$PROD_ECS_CLUSTER" \
            --service "$PROD_ECS_SERVICE" \
            --task-definition "$PROD_TASK_ARN" \
            --output json | jq '{service:.service.serviceName,taskDef:.service.taskDefinition,desired:.service.desiredCount}'

      # ----------------------------------------------------------
      # 8. Wait for prod deployment with diagnostic output
      # ----------------------------------------------------------
      - name: Wait for production deployment to complete
        run: |
          echo "Waiting for production ECS deployment — timeout 30 min"
          MAX=120
          SLEEP=15

          for i in $(seq 1 $MAX); do
            SVC=$(aws ecs describe-services \
              --region "$AWS_REGION" \
              --cluster "$PROD_ECS_CLUSTER" \
              --services "$PROD_ECS_SERVICE" \
              --output json)

            DESIRED=$(echo "$SVC" | jq -r '.services[0].desiredCount')
            RUNNING=$(echo "$SVC" | jq -r '.services[0].runningCount')
            PENDING=$(echo "$SVC" | jq -r '.services[0].pendingCount')
            ROLLOUT=$(echo "$SVC" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState')

            echo "[${i}/${MAX}] desired=${DESIRED} running=${RUNNING} pending=${PENDING} rollout=${ROLLOUT}"

            if [ "$ROLLOUT" = "FAILED" ]; then
              echo "ERROR: Production ECS deployment FAILED."
              echo "$SVC" | jq -r '.services[0].events[:10][] | "  " + .message'
              exit 1
            fi

            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ]; then
              echo "Production deployment completed successfully."
              exit 0
            fi

            sleep $SLEEP
          done

          echo "ERROR: Production deployment timed out after $((MAX * SLEEP)) seconds."
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$PROD_ECS_CLUSTER" \
            --services "$PROD_ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments}' \
            --output json
          exit 1

      # ----------------------------------------------------------
      # 9. Verify prod ECS service stability and health endpoint
      # ----------------------------------------------------------
      - name: Verify production ECS service
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$PROD_ECS_CLUSTER" \
            --services "$PROD_ECS_SERVICE" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table

          RUNNING=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$PROD_ECS_CLUSTER" \
            --services "$PROD_ECS_SERVICE" \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$PROD_ECS_CLUSTER" \
            --services "$PROD_ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)

          if [ "$RUNNING" -lt 1 ] || [ "$RUNNING" -ne "$DESIRED" ]; then
            echo "ERROR: running=${RUNNING} desired=${DESIRED}"
            exit 1
          fi

      - name: Verify production application health endpoint
        run: |
          PROD_ALB=$(aws elbv2 describe-load-balancers \
            --region "$AWS_REGION" \
            --query "LoadBalancers[?contains(LoadBalancerName,'prod')].DNSName | [0]" \
            --output text)

          if [ -z "$PROD_ALB" ] || [ "$PROD_ALB" = "None" ]; then
            echo "ERROR: Could not resolve production ALB DNS name."
            exit 1
          fi

          URL="http://${PROD_ALB}/health"
          echo "Testing: ${URL}"

          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/prod-health.json -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "[${i}/10] HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/prod-health.json
              exit 0
            fi
            sleep 15
          done

          echo "ERROR: Production health check failed."
          exit 1
